[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appointment-booking"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]