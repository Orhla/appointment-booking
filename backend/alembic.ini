# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; the default combo
# is available in version 1.13 and greater
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, space-separated, or a list of paths; allows generic search of cells
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to encode the slug of a revision
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow 'autogenerate' to automatically
# atomic migrations when possible
# enforce_history = false

# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version_path_separator = :

# set to 'true' to enable output of logging configuration
# inside the generated scripts
# output_encoding = utf-8

# Поскольку мы подставляем URL динамически в env.py, 
# здесь мы можем оставить пустую строку или дефолтный шаблон.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks allows running scripts after a revision is created.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = REVISION_SCRIPT_FILE --line-length 79


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S